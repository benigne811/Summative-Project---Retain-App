services:
  - type: web
    name: retain-api
    runtime: node
    plan: free
    region: singapore
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: ADMIN_EMAIL
        sync: false
      - key: DATABASE_URL
        sync: false

  - type: web
    name: retain-client
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: off
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: retain-api
          type: web
          property: host
